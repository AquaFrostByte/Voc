<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Digitizer</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Vocabulary Digitizer</h2>
        <p style="font-size: 0.9rem; color: #666;">
            <strong>Tip:</strong> Press <code>Enter</code> on the first box to skip translation. Press <code>Tab</code> to jump to the translation box.
        </p>

        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Word (Press Enter or Tab)" autofocus>
            <input type="text" id="transInput" placeholder="Translation (Press Enter)">
        </div>

        <button id="exportBtn">Download Excel File</button>

        <table>
            <thead>
                <tr>
                    <th>Word</th>
                    <th>Translation</th>
                </tr>
            </thead>
            <tbody id="vocabTableBody">
                <tr><td colspan="2" class="empty-state">No words added yet. Start typing!</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
